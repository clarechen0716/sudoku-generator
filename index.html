<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图像数独生成器</title><style>body{font-family:Arial,'Noto Sans CJK SC',sans-serif;margin:0;background:#f5f6f8;color:#20242a}main{max-width:920px;margin:auto;padding:24px}h1{font-size:27px}p{color:#555}.panel{background:white;border:1px solid #ddd;border-radius:12px;padding:18px;margin:14px 0}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.item{border:1px solid #ddd;border-radius:8px;padding:10px;display:flex;gap:10px;align-items:center}.item input[type=text]{width:100%;min-width:0;font-size:18px;padding:7px;box-sizing:border-box}.thumb{width:46px;height:46px;object-fit:contain;border:1px solid #ddd;border-radius:5px}.item label{font-size:12px;display:block;cursor:pointer}.item input[type=file]{width:110px;font-size:10px}button,select{padding:10px 15px;border:1px solid #bbc2cb;border-radius:7px;background:white;font-size:15px;cursor:pointer}button.primary{background:#2054b4;color:white;border-color:#2054b4}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.board{display:grid;grid-template-columns:repeat(6,1fr);width:min(100%,570px);aspect-ratio:1;margin:22px auto;border:3px solid #20242a}.cell{display:flex;align-items:center;justify-content:center;border-right:1px solid #444;border-bottom:1px solid #444;font-size:clamp(15px,3vw,28px);font-weight:600;min-width:0}.cell img{width:80%;height:80%;object-fit:contain}.legend{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.legend span{display:flex;align-items:center;gap:5px;border:1px solid #ddd;padding:6px 10px;border-radius:5px}.legend img{width:32px;height:32px;object-fit:contain}.print-head{text-align:center}.note{font-size:13px;color:#777}.hide{display:none}@media(max-width:620px){.items{grid-template-columns:repeat(2,1fr)}main{padding:12px}.item{display:block}}@media print{@page{size:letter;margin:0.55in}body{background:white}main{padding:0;max-w
